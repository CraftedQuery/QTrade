# Base configuration for the AI Trading Lab.
#
# Placeholder shape only — no code reads this file until Weeks 3-4.
# No secrets belong in this file. Credentials come from the environment.

lab:
  environment: dev
  timezone: UTC

universe:
  # A dated universe with membership by date. Start small: 50 liquid names,
  # not 300. `source` must be a licensed API, never a scraped page.
  id: liquid50_v1
  source: null
  max_names: 50
  # Set true only for a source that provides genuine point-in-time membership.
  # yfinance current S&P membership is NOT point-in-time.
  point_in_time: false

data:
  bar_interval: 1day
  adjustment: split_and_dividend
  root: ./data

walk_forward:
  # Purge and embargo are required, not optional. They remove label overlap
  # around split boundaries.
  purge: P21D
  embargo: P5D

schedule:
  # Rebalance frequency. monthly is the default: standard for momentum, and it
  # keeps turnover from eating the edge before it can be measured. weekly and
  # daily are supported so that tradeoff can be measured rather than assumed.
  # Sessions are derived from observed bars, not from a calendar library.
  rebalance: monthly   # monthly | weekly | daily

costs:
  model_id: conservative_v1

experiment:
  # The holdout is declared at registration and stays sealed until the freeze.
  holdout_start: null
  holdout_end: null
