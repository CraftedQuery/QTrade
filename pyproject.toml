[project]
name = "ai-trading-lab"
version = "0.1.0"
description = "Paper-trading research laboratory for liquid U.S. equities and ETFs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# Week 1-2 needs contracts and nothing else. FastAPI, PostgreSQL, DuckDB,
# MLflow, Streamlit and alpaca-py are pinned when their slice arrives.
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    # Storage layer. The store writes Arrow directly, never via pandas, so a
    # Decimal price cannot be silently coerced to a float on the way to disk.
    "pyarrow>=17,<22",
    "duckdb>=1.1,<2",
    # Declared now per decision D2 in docs/04_release_02_plan.md. Unused until
    # the feature pipeline (task 5), metrics (task 10) and the ridge model
    # (task 8); resolved in one go so later tasks do not each churn the lock.
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<0.13",
    "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "S"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of a test

[tool.ruff.lint.isort]
known-first-party = ["lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
